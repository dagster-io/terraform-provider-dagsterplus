fragment WorkspaceEntryFields on WorkspaceEntry {
  locationName
  serializedDeploymentMetadata
}

query ListCodeLocations {
  workspace {
    workspaceEntries {
      ...WorkspaceEntryFields
    }
  }
}

mutation AddOrUpdateCodeLocation($document: GenericScalar!) {
  addOrUpdateLocationFromDocument(document: $document) {
    __typename
    ... on WorkspaceEntry {
      ...WorkspaceEntryFields
    }
    ... on InvalidLocationError {
      message
      errors
    }
  }
}

mutation DeleteCodeLocation($name: String!) {
  deleteLocation(locationName: $name) {
    __typename
  }
}
