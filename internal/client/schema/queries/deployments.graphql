fragment DeploymentFields on DagsterCloudDeployment {
  deploymentId
  deploymentName
  deploymentType
  deploymentStatus
  agentType
}

query ListDeployments {
  deployments {
    ...DeploymentFields
  }
}

mutation CreateDeployment(
  $name: String!
  # agentType is a pointer so the caller can pass nil to omit it entirely and
  # let the organization's default agent type apply.
  # @genqlient(pointer: true)
  $agentType: DeploymentAgentType
) {
  createDeployment(deploymentName: $name, deploymentAgentType: $agentType) {
    __typename
    ... on DagsterCloudDeployment {
      ...DeploymentFields
    }
    ... on DeploymentNotFoundError {
      message
    }
    ... on UnauthorizedError {
      message
    }
    ... on DuplicateDeploymentError {
      message
    }
    ... on DeploymentLimitError {
      message
    }
    ... on PythonError {
      message
    }
  }
}

mutation UpdateDeploymentAgentType($id: Int!, $agentType: DeploymentAgentType!) {
  updateDeploymentAgentType(deploymentId: $id, deploymentAgentType: $agentType) {
    __typename
    ... on DagsterCloudDeployment {
      ...DeploymentFields
    }
    ... on DeploymentNotFoundError {
      message
    }
    ... on UnauthorizedError {
      message
    }
    ... on PythonError {
      message
    }
  }
}

mutation DeleteDeployment($id: Int!) {
  deleteDeployment(deploymentId: $id) {
    __typename
  }
}
