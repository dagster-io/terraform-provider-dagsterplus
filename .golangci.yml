version: "2"
linters:
  enable:
    - gochecknoinits
    - gosec
  settings:
    gosec:
      excludes:
        - G404 # weak RNG — not a concern in test helpers
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
